<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Exchange App</title>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <header class="header wrap">
        <div>
            <p class="eyebrow">Currency Exchange & News</p>
            <h1>货币兑换与资讯平台</h1>
            <p class="subtitle">实时管理汇率、发布快讯、追踪文章热度</p>
        </div>
        <div class="token-bar">
            <span id="authStatus" class="status-pill">未登录</span>
            <button id="logoutBtn" type="button" class="btn-ghost">退出登录</button>
        </div>
    </header>

    <main class="container wrap">
        <section class="panel summary-grid">
            <article class="summary-card">
                <p>汇率条数</p>
                <h3 id="rateCount">0</h3>
            </article>
            <article class="summary-card">
                <p>新闻条数</p>
                <h3 id="articleCount">0</h3>
            </article>
            <article class="summary-card">
                <p>当前状态</p>
                <h3 id="summaryAuth">游客</h3>
            </article>
        </section>

        <section class="panel">
            <h2>账号认证</h2>
            <div class="grid two-col">
                <form id="registerForm" class="form card-inner">
                    <h3>注册</h3>
                    <label>
                        用户名
                        <input name="username" required />
                    </label>
                    <label>
                        密码
                        <input name="password" type="password" required />
                    </label>
                    <button type="submit">注册并登录</button>
                </form>

                <form id="loginForm" class="form card-inner">
                    <h3>登录</h3>
                    <label>
                        用户名
                        <input name="username" required />
                    </label>
                    <label>
                        密码
                        <input name="password" type="password" required />
                    </label>
                    <button type="submit">登录</button>
                </form>
            </div>
        </section>

        <section class="panel">
            <div class="section-head">
                <h2>汇率看板</h2>
                <button id="refreshRatesBtn" type="button" class="btn-ghost">刷新列表</button>
            </div>
            <form id="exchangeForm" class="form inline-form">
                <label>
                    源币种
                    <input name="fromCurrency" placeholder="USD" required />
                </label>
                <label>
                    目标币种
                    <input name="toCurrency" placeholder="CNY" required />
                </label>
                <label>
                    汇率
                    <input name="rate" type="number" step="0.000001" required />
                </label>
                <button type="submit">新增汇率（需登录）</button>
            </form>

            <section class="converter card-inner">
                <h3>汇率换算器</h3>
                <div class="converter-grid">
                    <label>
                        选择币种对
                        <select id="converterPair"></select>
                    </label>
                    <label>
                        输入金额
                        <input id="converterAmount" type="number" min="0" step="0.01" placeholder="例如 100" />
                    </label>
                </div>
                <div class="converter-actions">
                    <button id="reverseDirectionBtn" type="button" class="btn-ghost">兑换方向反转</button>
                    <label class="mode-switch">
                        <input id="keepResultMode" type="checkbox" checked />
                        反转时保留结果为新输入金额
                    </label>
                </div>
                <p id="converterResult" class="converter-result">请先加载汇率并输入金额</p>
            </section>

            <div id="exchangeRates" class="list"></div>
        </section>

        <section class="panel">
            <div class="section-head">
                <h2>新闻中心</h2>
                <button id="refreshArticlesBtn" type="button" class="btn-ghost">刷新列表</button>
            </div>
            <form id="articleForm" class="form card-inner">
                <label>
                    新闻标题
                    <input name="title" required />
                </label>
                <label>
                    简要导语
                    <input name="preview" required />
                </label>
                <label>
                    正文
                    <textarea name="content" rows="4" required></textarea>
                </label>
                <button type="submit">发布文章（需登录）</button>
            </form>

            <div class="grid two-col">
                <div>
                    <h3>新闻列表</h3>
                    <div id="articleList" class="list"></div>
                </div>
                <div>
                    <h3>新闻详情</h3>
                    <div id="articleDetail" class="detail">点击左侧“查看详情”加载</div>
                </div>
            </div>
        </section>
    </main>

    <section id="toast" class="toast"></section>

    <script src="./app.js"></script>
</body>

</html>
